[project]
name = "sigk-low-light"
version = "0.1.0"
description = "SIGK project 2: low light image enhancement (RAISE, Nikon D7000, indoor) in PyTorch"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    "numpy>=1.26",
    "rawpy>=0.21",
    "imageio>=2.34",
    "requests>=2.31",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "lpips>=0.1.4",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "tqdm>=4.66",
    "tensorboard>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lle"]

# RTX 50xx (Blackwell, sm_120) requires CUDA 12.8 wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
