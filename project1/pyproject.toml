[project]
name = "sigk-image-restoration"
version = "0.1.0"
description = "SIGK project: image restoration (super-resolution / denoising / deblurring / inpainting) on DIV2K with PyTorch"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "lpips>=0.1.4",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sigk"]

# RTX 50xx (Blackwell, sm_120) needs CUDA 12.8 wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
