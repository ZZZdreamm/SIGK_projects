[project]
name = "sigk-neural-rendering"
version = "0.1.0"
description = "SIGK project 3: neural rendering of the Phong lighting model (conditional GAN) in PyTorch"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    "numpy>=2.0",
    # provided renderer (SIGK___Projekt_3/requirements.txt)
    "moderngl==5.12.0",
    "moderngl-window==3.1.1",
    "glcontext==3.0.0",
    "pyglet==2.1.5",
    "pyglm==2.8.2",
    "pyrr==0.10.3",
    "PyWavefront==1.3.3",
    "multipledispatch==1.0.0",
    "pillow>=11",
    # metrics / tooling
    "flip-evaluator>=1.6",
    "lpips>=0.1.4",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nr"]

# RTX 50xx (Blackwell, sm_120) requires CUDA 12.8 wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
